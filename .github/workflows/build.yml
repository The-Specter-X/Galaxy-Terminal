name: Build and test
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    container: debian:forky
    strategy:
      fail-fast: false
      matrix:
        sanitizer: ['none', 'address,undefined']
    env:
      ASAN_OPTIONS: detect_leaks=0:halt_on_error=1
      UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
    steps:
      - uses: actions/checkout@v4
      - name: Install Debian 14 testing dependencies
        run: |
          apt-get update
          apt-get install -y build-essential meson ninja-build pkg-config libgtk-3-dev libvte-2.91-dev libxapp-dev libpcre2-dev gettext weston xvfb dbus-x11 tmux fonts-noto-color-emoji desktop-file-utils debhelper dpkg-dev
      - name: Configure
        run: meson setup build -Db_sanitize='${{ matrix.sanitizer }}' -Db_lundef=false
      - name: Build
        run: meson compile -C build
      - name: Unit tests
        run: meson test -C build --print-errorlogs
      - name: Wayland integration tests
        run: bash tests/wayland-smoke.sh
      - name: Validate install and Debian package
        if: matrix.sanitizer == 'none'
        run: |
          DESTDIR="$PWD/stage" meson install -C build
          test -x stage/usr/local/bin/galaxy-terminal
          test -f stage/usr/local/share/man/man1/galaxy-terminal.1
          desktop-file-validate stage/usr/local/share/applications/org.thespecterx.GalaxyTerminal.desktop
          dpkg-buildpackage --no-sign -b
          dpkg-deb --info ../galaxy-terminal_*.deb
      - name: Keep test logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: logs-${{ strategy.job-index }}
          path: build/meson-logs/
